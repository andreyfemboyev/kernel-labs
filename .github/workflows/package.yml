name: Package release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'docs/RELEASE-v0.1.0-alpha.md'
      - '.github/workflows/package.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: deb,appimage
            exe: klab
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis
            exe: klab.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p klab
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        working-directory: apps/desktop
      - name: Assemble verified build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          target/release/${{ matrix.exe }} --version
          tar -czf release-candidate/klab-${{ matrix.platform }}.tar.gz BUILDING.md LICENSE -C target/release ${{ matrix.exe }}
          if [[ "${{ runner.os }}" = Linux ]]; then
            cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release-candidate/
            cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-candidate/
          else
            cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe release-candidate/
          fi
          git archive --prefix=kernel-lab/ --format=tar.gz -o release-candidate/kernel-lab-source.tar.gz HEAD
          (cd release-candidate && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.platform }}
          path: release-candidate/
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-candidate-*
          path: candidates
      - name: Verify and assemble archives
        run: |
          set -euo pipefail
          mkdir release
          for candidate in candidates/release-candidate-*; do
            (cd "$candidate" && sha256sum -c SHA256SUMS)
            tar -czf "release/${candidate##*/}.tar.gz" -C "$candidate" .
          done
          (cd release && sha256sum -- *.tar.gz > SHA256SUMS)
      - name: Stage a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != v0.1.0-alpha ]]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --generate-notes release/*
              exit 0
            fi
          else
            TAG=v0.1.0-alpha
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets automatically."
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "KERNEL//LAB $TAG" --notes-file docs/RELEASE-v0.1.0-alpha.md release/*
