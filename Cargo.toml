[workspace]
resolver = "2"
members = ["apps/cli", "crates/*"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "signal", "sync", "time"] }
